<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Банки.ру: Политика проведения тендеров и согласования договоров</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbfd}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="presentation" src="original.html" title="Политика проведения тендеров и согласования договоров"></iframe>
<script>
const frame=document.getElementById('presentation');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc) return;
  doc.querySelectorAll('.approver').forEach(el=>{
    if(el.textContent.includes('Автор и владелец документа: М. Князева.')) el.remove();
  });
  doc.querySelectorAll('img[alt="банки.ру"],img[alt="Банки.ру"]').forEach(img=>{
    img.src='logo-transparent.png';
    img.alt='Банки.ру';
  });
});
</script>
</body>
</html>
