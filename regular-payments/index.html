<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Банки.ру: Положение о регулярных оплатах</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbfd}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="presentation" src="content.html?v=20260820-01" title="Положение о регулярных оплатах"></iframe>
<script>
const frame = document.getElementById('presentation');

function styleWordmark(el, big){
  el.textContent = 'Банки.ру';
  el.style.display = 'inline-block';
  el.style.whiteSpace = 'nowrap';
  el.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
  el.style.fontWeight = '800';
  el.style.letterSpacing = '-0.03em';
  el.style.color = '#000';
  el.style.lineHeight = '1';
  el.style.margin = '0';
  el.style.padding = '0';
  el.style.maxWidth = 'none';
  if (big) {
    el.style.fontSize = '52px';
  } else {
    el.style.fontSize = '24px';
  }
}

function fixLogo(){
  const doc = frame.contentDocument;
  if(!doc) return;

  const smallImg = doc.querySelector('.brand-logo');
  if (smallImg && !doc.querySelector('.brand-wordmark-replacement-top')) {
    const smallWordmark = doc.createElement('span');
    smallWordmark.className = 'brand-wordmark-replacement-top';
    styleWordmark(smallWordmark, false);
    smallImg.replaceWith(smallWordmark);
  }

  const bigImg = doc.querySelector('.big-logo img');
  if (bigImg && !doc.querySelector('.brand-wordmark-replacement-big')) {
    const bigWordmark = doc.createElement('div');
    bigWordmark.className = 'brand-wordmark-replacement-big';
    styleWordmark(bigWordmark, true);
    bigImg.replaceWith(bigWordmark);
  }
}

frame.addEventListener('load',()=>{
  fixLogo();
  setTimeout(fixLogo,100);
  setTimeout(fixLogo,500);
  setTimeout(fixLogo,1500);
});
</script>
</body>
</html>
