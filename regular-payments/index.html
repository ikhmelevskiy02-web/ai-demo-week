<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Банки.ру: Положение о регулярных оплатах</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbfd}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="presentation" src="content.html?v=20260819-2" title="Положение о регулярных оплатах"></iframe>
<script>
const frame=document.getElementById('presentation');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc) return;
  doc.querySelectorAll('img[alt="Банки.ру"],img[alt="банки.ру"]').forEach(img=>{
    img.src='../tender-policy/logo-transparent.png?v=20260819-2';
    img.alt='Банки.ру';
    img.style.objectFit='contain';
  });
});
</script>
</body>
</html>
