<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Банки.ру: Положение о регулярных оплатах</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbfd}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="presentation" src="content.html?v=20260819-1842" title="Положение о регулярных оплатах"></iframe>
<script>
const frame=document.getElementById('presentation');
const logoUrl=new URL('logo-transparent.png?v=20260819-1842',window.location.href).href;

function fixLogo(){
  const doc=frame.contentDocument;
  if(!doc) return;

  const brand=doc.querySelector('.brand-logo');
  if(brand){
    brand.removeAttribute('srcset');
    brand.src=logoUrl;
    brand.alt='Банки.ру';
    brand.style.setProperty('height','28px','important');
    brand.style.setProperty('width','auto','important');
    brand.style.setProperty('max-width','none','important');
    brand.style.setProperty('object-fit','contain','important');
  }

  const big=doc.querySelector('.big-logo img');
  if(big){
    big.removeAttribute('srcset');
    big.src=logoUrl;
    big.alt='Банки.ру';
    big.style.setProperty('height','56px','important');
    big.style.setProperty('width','auto','important');
    big.style.setProperty('max-width','none','important');
    big.style.setProperty('object-fit','contain','important');
  }
}

frame.addEventListener('load',()=>{
  fixLogo();
  setTimeout(fixLogo,100);
  setTimeout(fixLogo,500);
  setTimeout(fixLogo,1500);
});
</script>
</body>
</html>
